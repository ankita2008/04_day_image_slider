<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <div class="gallery-container">
            <img class="gallery-item gallery-item-1" src="img/img1.jpg" data-index="1">
            <img class="gallery-item gallery-item-2" src="img/img2.jpg" data-index="2">
            <img class="gallery-item gallery-item-3" src="img/img3.jpg" data-index="3">
            <img class="gallery-item gallery-item-4" src="img/img4.jpg" data-index="4">
            <img class="gallery-item gallery-item-5" src="img/img5.jpg" data-index="5">
        </div>
       <div class="gallery-controls"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
